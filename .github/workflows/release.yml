name: Release

# Publishes to PyPI with trusted publishing (no stored token) when a GitHub
# release is published. The tag must match the package version (v0.1.0).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the version
        run: |
          version=$(uv run --no-project python -c "import re;print(re.search(r'\"(.+)\"', open('src/freetheai/_version.py').read()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}"
      - run: uv run --group dev pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
