[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "freetheai"
dynamic = ["version"]
description = "Official Python SDK for FreeTheAI: a free OpenAI-compatible AI API with chat, streaming, web search, and image and video tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "FreeTheAI", email = "vibheksoni@engineer.com" }]
keywords = [
  "freetheai", "free ai api", "openai compatible", "llm", "ai sdk", "chat completions",
  "streaming", "web search", "free llm api", "gpt", "claude", "gemini", "deepseek",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.urls]
Homepage = "https://freetheai.org"
Documentation = "https://freetheai.org/docs"
Repository = "https://github.com/Free-The-Ai/freetheai-python"
Issues = "https://github.com/Free-The-Ai/freetheai-python/issues"
Changelog = "https://github.com/Free-The-Ai/freetheai-python/releases"
Discord = "https://discord.gg/secrets"

[tool.hatch.version]
path = "src/freetheai/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/freetheai"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]
