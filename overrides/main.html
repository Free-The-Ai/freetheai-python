{% extends "base.html" %}
{% block extrahead %}
  {% set image = config.site_url ~ "assets/banner.jpg" %}
  {% set title = (page.title ~ " - " ~ config.site_name) if page and page.title and not page.is_homepage else config.site_name %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ (page.meta.description if page and page.meta and page.meta.description else config.site_description) }}">
  <meta property="og:image" content="{{ image }}">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ image }}">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"SoftwareSourceCode","name":"freetheai (Python SDK)","description":"{{ config.site_description }}","codeRepository":"{{ config.repo_url }}","programmingLanguage":"Python","license":"https://opensource.org/licenses/MIT","url":"{{ config.site_url }}","author":{"@type":"Organization","name":"FreeTheAI","url":"https://freetheai.org"}}
  </script>
{% endblock %}
