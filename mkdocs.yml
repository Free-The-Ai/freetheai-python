site_name: FreeTheAI Python SDK
site_description: Official Python SDK for FreeTheAI, the free OpenAI-compatible AI API. Chat, streaming, tool calls, web search, image and video tasks, with built-in retries and fallback models.
site_url: https://free-the-ai.github.io/freetheai-python/
site_author: FreeTheAI
repo_url: https://github.com/Free-The-Ai/freetheai-python
repo_name: Free-The-Ai/freetheai-python
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 FreeTheAI. MIT licensed.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Host Grotesk
    code: Azeret Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: Light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Guides:
      - Chat and streaming: guides/chat.md
      - Tool calls: guides/tools.md
      - Web search: guides/web-search.md
      - Images and video: guides/media.md
      - Async: guides/async.md
  - Reliability: reliability.md
  - Errors: errors.md
  - Configuration: configuration.md
  - API reference: reference.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
            docstring_style: sphinx

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Free-The-Ai
    - icon: fontawesome/brands/discord
      link: https://discord.gg/secrets
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/ImVibhek
    - icon: material/web
      link: https://freetheai.org
  generator: false
